<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 240" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <!-- Logo Glow Gradients -->
    <linearGradient id="cyberCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="accentPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <linearGradient id="amberOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#ef4444" />
    </linearGradient>

    <!-- Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    .title-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-weight: 800; font-size: 42px; fill: #ffffff; letter-spacing: -0.5px; }
    .badge-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-weight: 700; font-size: 13px; fill: #06b6d4; letter-spacing: 1.5px; }
    .sub-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-weight: 400; font-size: 16px; fill: #94a3b8; }
    .wave-bar { animation: pulse 2s infinite ease-in-out; }
  </style>

  <!-- Card Background -->
  <rect width="800" height="240" rx="20" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="1.5" />

  <!-- Ambient Light Effect -->
  <circle cx="120" cy="120" r="90" fill="#3b82f6" opacity="0.12" filter="url(#glow)" />
  <circle cx="210" cy="80" r="70" fill="#ec4899" opacity="0.08" filter="url(#glow)" />

  <!-- Left Icon Area -->
  <g transform="translate(45, 45)">
    <!-- Hexagon Frame -->
    <polygon points="75,5 140,42 140,118 75,155 10,118 10,42" fill="#0f172a" stroke="url(#cyberCyan)" stroke-width="2.5" filter="url(#softGlow)" opacity="0.9" />

    <!-- Video Camera Lens Base -->
    <rect x="38" y="52" width="56" height="46" rx="8" fill="url(#cyberCyan)" opacity="0.15" />
    <rect x="38" y="52" width="56" height="46" rx="8" stroke="url(#cyberCyan)" stroke-width="2.5" fill="none" />

    <!-- Video Lens Side Triangle -->
    <path d="M94 65 L116 52 L116 98 L94 85 Z" fill="url(#cyberCyan)" opacity="0.8" />

    <!-- Audio / AI Wave inside screen -->
    <!-- Wave bars -->
    <rect x="47" y="68" width="4" height="14" rx="2" fill="url(#accentPurple)" />
    <rect x="55" y="61" width="4" height="28" rx="2" fill="#38bdf8" />
    <rect x="63" y="58" width="4" height="34" rx="2" fill="url(#accentPurple)" />
    <rect x="71" y="63" width="4" height="24" rx="2" fill="#38bdf8" />
    <rect x="79" y="70" width="4" height="10" rx="2" fill="url(#accentPurple)" />

    <!-- Lightning / Fast Intelligence Spark -->
    <path d="M124 35 L112 50 L120 50 L114 65 L130 47 L122 47 Z" fill="url(#amberOrange)" filter="url(#glow)" />
  </g>

  <!-- Typography / Brand -->
  <!-- Tag / Pill Badge -->
  <g transform="translate(230, 48)">
    <rect width="180" height="26" rx="13" fill="#0c4a6e" fill-opacity="0.5" stroke="#0284c7" stroke-width="1" />
    <circle cx="14" cy="13" r="4" fill="#38bdf8" filter="url(#softGlow)" />
    <text x="26" y="17" class="badge-text">AI SPEECH &amp; VISION</text>
  </g>

  <!-- Main Title -->
  <text x="230" y="112" class="title-text">
    Video Analyzer <tspan fill="url(#cyberCyan)">Tool</tspan>
  </text>

  <!-- Tagline / Subtitle -->
  <text x="230" y="146" class="sub-text">
    Zero-Download Video Speech Transcription, Targeted Visual Frame
  </text>
  <text x="230" y="170" class="sub-text">
    Extraction &amp; Smart Timeline Alignment for Android / Linux.
  </text>

  <!-- Tech Pills / Highlights -->
  <g transform="translate(230, 192)">
    <!-- Pill 1 -->
    <rect x="0" y="0" width="102" height="24" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="10" y="16" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" fill="#cbd5e1">⚡ Whisper Turbo</text>

    <!-- Pill 2 -->
    <rect x="110" y="0" width="105" height="24" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="120" y="16" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" fill="#38bdf8">🇧🇩 Bangla ggml</text>

    <!-- Pill 3 -->
    <rect x="223" y="0" width="95" height="24" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="233" y="16" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" fill="#c084fc">✂️ Smart Trim</text>

    <!-- Pill 4 -->
    <rect x="326" y="0" width="110" height="24" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="336" y="16" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" fill="#34d399">🎯 Auto Frames</text>
  </g>
</svg>
